.rk-gd{font-family:'DM Mono';font-size:11px;text-align:right;font-weight:600;}
.rk-mvp{display:inline-flex;align-items:center;gap:3px;background:#FFF8E0;border:1px solid rgba(201,147,58,.25);border-radius:5px;padding:2px 7px;font-family:'DM Mono';font-size:9px;color:#C9933A;justify-self:flex-end;}
.rk-mvp.z{opacity:0;}
.rk-sh{background:rgba(201,147,58,.04);}
.rk-upd{margin-top:12px;font-family:'DM Mono';font-size:9px;color:#b0c4d8;text-align:right;}
.rk-ref-btn{background:#fff;border:1px solid #dde6f0;border-radius:7px;color:#9ab0c8;cursor:pointer;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .2s;}
.rk-ref-btn:hover{border-color:#C9933A;color:#C9933A;}
.rk-ref-btn.spin{animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
