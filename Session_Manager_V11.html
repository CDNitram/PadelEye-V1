<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelEye · Session Manager · V10.1</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100vh;overflow-x:hidden;}
body{font-family:'DM Sans',sans-serif;font-size:14px;color:#0d1e3a;background:#f0f5fb;}
.screen{display:none;min-height:100vh;}
.screen.active{display:flex;flex-direction:column;}
#s-login{align-items:center;justify-content:center;background:#f4f7fc;padding:24px;}
.login-brand{text-align:center;margin-bottom:32px;}
.login-logo{font-family:'Bebas Neue';font-size:44px;color:#0a1628;letter-spacing:3px;line-height:1;}
.login-logo em{color:#C9933A;font-style:normal;}
.login-sub{font-family:'DM Mono';font-size:10px;letter-spacing:2px;color:#9ab0c8;margin-top:5px;text-transform:uppercase;}
.login-card{background:#fff;border:1px solid #dde6f0;border-radius:18px;padding:28px;max-width:380px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.07);}
.login-card-title{font-size:16px;font-weight:700;color:#0d1e3a;margin-bottom:3px;}
.login-card-sub{font-size:11px;color:#9ab0c8;margin-bottom:22px;}
.lfield{margin-bottom:14px;}
.lfield label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#7090b0;display:block;margin-bottom:5px;}
.lfield input{width:100%;background:#f4f7fc;border:1px solid #dde6f0;border-radius:10px;color:#0d1e3a;font-family:'DM Sans';font-size:14px;padding:12px 14px;outline:none;transition:all .2s;}
.lfield input:focus{border-color:#C9933A;background:#fff;}
.lfield input::placeholder{color:#c0cdd8;}
.btn-login{width:100%;background:linear-gradient(135deg,#C9933A,#e0a840);color:#0a1628;font-weight:700;font-size:14px;padding:14px;border:none;border-radius:10px;cursor:pointer;margin-top:4px;transition:all .2s;}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(201,147,58,.3);}
.login-error{background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.25);border-radius:8px;padding:9px 13px;font-size:12px;color:#c0392b;margin-bottom:12px;display:none;text-align:center;}
.login-footer{font-family:'DM Mono';font-size:9px;color:#c0cdd8;text-align:center;margin-top:18px;letter-spacing:1px;}
.topbar{background:#fff;height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:200;border-bottom:1px solid #dde6f0;}
.topbar-logo{font-family:'Bebas Neue';font-size:20px;color:#0a1628;letter-spacing:1px;}
.topbar-logo em{color:#C9933A;font-style:normal;}
.topbar-center{font-family:'DM Mono';font-size:11px;color:#9ab0c8;letter-spacing:1px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.topbar-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#C9933A,#e0a840);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';font-size:13px;color:#0a1628;box-shadow:0 2px 8px rgba(201,147,58,.3);}
.btn-out{background:none;border:1px solid #dde6f0;border-radius:7px;color:#5a7090;font-size:11px;padding:5px 12px;cursor:pointer;font-family:'DM Sans';transition:all .2s;}
.btn-out:hover{background:#f4f7fc;color:#0a1628;}
.app-body{display:flex;min-height:calc(100vh - 52px);}
.sidebar-nav{width:230px;background:#fff;border-right:1px solid #dde6f0;flex-shrink:0;padding:8px 0 20px;position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto;}
.sb-section-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#b0c4d8;padding:14px 16px 5px;display:flex;align-items:center;gap:6px;}
.sb-section-label::after{content:'';flex:1;height:0.5px;background:#edf2f7;}
.sb-ic{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;transition:transform .15s;}
.tab{display:flex;align-items:center;gap:10px;padding:7px 12px 7px 14px;width:100%;text-align:left;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:#5a7090;background:none;border:none;border-left:3px solid transparent;cursor:pointer;white-space:nowrap;transition:all .15s;box-sizing:border-box;}
.tab.on{color:#0a1628;border-left-color:#C9933A;background:linear-gradient(90deg,rgba(201,147,58,.08),transparent);font-weight:700;}
.tab.on .sb-ic{transform:scale(1.1);}
.tab:hover:not(.on):not(.disabled){color:#0d1e3a;background:#f8fafd;}
.tab.disabled{opacity:.4;cursor:not-allowed;pointer-events:none;}
.sb-divider{height:1px;background:#f0f5fb;margin:6px 12px;}
.main-content{flex:1;overflow-y:auto;padding:16px;}
.panel{display:none;max-width:700px;margin:0 auto;width:100%;}
.panel.on{display:block;}
.card{background:#fff;border:1px solid #dde6f0;border-radius:12px;padding:16px;margin-bottom:14px;}
.card-title{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#9ab0c8;margin-bottom:12px;}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:10px;font-weight:700;}
.badge.green{background:#E8F8EE;color:#1a7a44;}
.badge.gold{background:#FFF8E0;color:#865a10;}
.badge.blue{background:#EBF4FF;color:#1a4a8a;}
.badge.gray{background:#f0f5fb;color:#7090b0;}
.session-hero{background:linear-gradient(135deg,#0a1628,#1a3052);border-radius:14px;padding:20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.session-num{font-family:'Bebas Neue';font-size:36px;color:#C9933A;letter-spacing:2px;line-height:1;}
.session-date{font-size:11px;color:#93C5FD;margin-top:3px;font-family:'DM Mono';}
.session-local{font-size:12px;color:#5a8aaa;margin-top:4px;}
.session-hero-right{text-align:right;}
.session-stat{margin-bottom:6px;}
.session-stat-v{font-family:'Bebas Neue';font-size:22px;color:#fff;line-height:1;}
.session-stat-l{font-size:9px;color:#5a8aaa;font-family:'DM Mono';}
.player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-bottom:12px;}
.player-chip{position:relative;background:#f8fafd;border:2px solid #e8edf4;border-radius:10px;padding:10px 8px;text-align:center;cursor:pointer;user-select:none;transition:all .15s;}
.player-chip:hover{border-color:#3a7bd5;transform:translateY(-1px);}
.player-chip.active{background:linear-gradient(135deg,#0a1628,#1a2d52);border-color:#3a7bd5;transform:translateY(-2px);box-shadow:0 4px 12px rgba(10,22,40,.2);}
.player-chip-av{width:36px;height:36px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';font-size:14px;color:#fff;}
.player-chip-name{font-size:11px;font-weight:600;color:#0d1e3a;line-height:1.2;}
.player-chip.active .player-chip-name{color:#fff;}
.player-chip-pts{font-family:'DM Mono';font-size:9px;color:#9ab0c8;margin-top:2px;}
.player-chip.active .player-chip-pts{color:#93C5FD;}
.player-check{position:absolute;top:5px;right:5px;width:14px;height:14px;border-radius:50%;background:#C9933A;display:none;align-items:center;justify-content:center;}
.player-chip.active .player-check{display:flex;}
.player-check svg{width:8px;height:8px;color:#fff;}
.match-builder{background:#f4f7fc;border:1px solid #dde6f0;border-radius:12px;padding:14px;margin-bottom:12px;}
.mb-title{font-family:'DM Mono';font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#9ab0c8;margin-bottom:10px;}
.team-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:10px;}
.team-select{background:#fff;border:1.5px solid #dde6f0;border-radius:8px;padding:8px 10px;font-family:'DM Sans';font-size:12px;color:#0d1e3a;outline:none;transition:border-color .2s;width:100%;}
.team-select:focus{border-color:#3a7bd5;}
.vs-label{font-family:'Bebas Neue';font-size:18px;color:#c0cdd8;text-align:center;}
.score-row{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:10px;}
.score-input{width:52px;height:52px;text-align:center;font-family:'Bebas Neue';font-size:28px;color:#0a1628;background:#fff;border:2px solid #dde6f0;border-radius:10px;outline:none;transition:all .2s;}
.score-input:focus{border-color:#C9933A;}
.score-input.win{border-color:#27AE60;color:#1a7a44;background:#f0fdf4;}
.score-input.lose{border-color:#fca5a5;color:#991b1b;}
.score-x{font-family:'Bebas Neue';font-size:22px;color:#c0cdd8;}
.tb-toggle{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:99px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid #dde6f0;background:#fff;color:#9ab0c8;transition:all .2s;font-family:'DM Sans';}
.tb-toggle.on{border-color:#C9933A;background:#FFF8E0;color:#C9933A;}
.tb-inputs{display:none;align-items:center;gap:8px;margin-top:8px;justify-content:center;}
.tb-inputs.show{display:flex;}
.tb-score{width:42px;height:38px;text-align:center;font-family:'Bebas Neue';font-size:20px;color:#865a10;background:#fff;border:1.5px solid #e8c870;border-radius:8px;outline:none;}
.tb-x{font-family:'Bebas Neue';font-size:16px;color:#e8c870;}
.btn-add-match{width:100%;padding:12px;background:#0a1628;color:#fff;border:none;border-radius:9px;font-family:'DM Sans';font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-add-match:hover{background:#132240;}
.match-log{display:flex;flex-direction:column;gap:8px;}
.match-item{background:#fff;border:1px solid #eaf0f8;border-radius:10px;padding:10px 13px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;}
.match-team{font-size:12px;font-weight:600;line-height:1.4;color:#0d1e3a;}
.match-team.right{text-align:right;}
.match-team.win{color:#1a7a44;}
.match-team.lose{color:#9ab0c8;}
.match-score{text-align:center;}
.match-score-main{font-family:'Bebas Neue';font-size:20px;color:#0a1628;letter-spacing:1px;}
.match-score-tb{font-size:9px;color:#C9933A;font-family:'DM Mono';}
.match-num{font-family:'DM Mono';font-size:9px;color:#b0c4d8;display:block;margin-bottom:2px;}
.btn-del{background:none;border:none;color:#e0a0a0;cursor:pointer;font-size:14px;padding:0 4px;}
.btn-del:hover{color:#c0392b;}
.scoreboard{display:flex;flex-direction:column;gap:6px;}
.sb-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #dde6f0;border-radius:10px;padding:10px 14px;}
.sb-row.leader{background:linear-gradient(135deg,#fffbf0,#fff8e0);border-color:#e8c870;}
.sb-pos{font-family:'Bebas Neue';font-size:18px;color:#0a1628;width:26px;text-align:center;flex-shrink:0;}
.sb-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';font-size:13px;color:#fff;flex-shrink:0;}
.sb-info{flex:1;}
.sb-name{font-size:13px;font-weight:700;color:#0d1e3a;}
.sb-stats{font-size:10px;color:#9ab0c8;font-family:'DM Mono';margin-top:2px;}
.sb-pts{font-family:'Bebas Neue';font-size:22px;color:#C9933A;flex-shrink:0;}
.sb-pts.leader{font-size:26px;}
.sb-bar{height:3px;background:#eaf0f8;border-radius:99px;overflow:hidden;margin-top:4px;}
.sb-bar-fill{height:100%;border-radius:99px;transition:width .4s;}
.save-card{border-color:rgba(201,147,58,.3);}
.save-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.save-kpi{background:#f4f7fc;border:1px solid #dde6f0;border-radius:8px;padding:10px;text-align:center;}
.save-kpi-v{font-family:'Bebas Neue';font-size:24px;color:#0a1628;line-height:1;}
.save-kpi-l{font-size:9px;color:#9ab0c8;margin-top:2px;}
.btn-save-session{width:100%;padding:14px;background:linear-gradient(135deg,#C9933A,#e0a840);color:#0a1628;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;font-family:'DM Sans';transition:all .2s;}
.btn-save-session:hover{box-shadow:0 4px 16px rgba(201,147,58,.3);}
.save-done-box{background:#E8F8EE;border:1.5px solid #c8e8d0;border-radius:12px;padding:18px 20px;display:none;}
.save-done-title{font-family:'Bebas Neue';font-size:20px;color:#1a7a44;letter-spacing:1px;margin-bottom:4px;}
.save-done-log{font-family:'DM Mono';font-size:11px;color:#2d8a50;line-height:1.8;}
#add-player-modal{position:fixed;inset:0;background:rgba(10,22,40,.8);z-index:600;display:none;align-items:center;justify-content:center;padding:16px;}
#add-player-modal.show{display:flex;}
.ap-box{background:#fff;border-radius:18px;padding:24px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto;}
.ap-title{font-family:'Bebas Neue';font-size:22px;color:#0a1628;letter-spacing:1px;margin-bottom:3px;}
.ap-sub{font-size:11px;color:#9ab0c8;margin-bottom:18px;}
.ap-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.ap-field{margin-bottom:10px;}
.ap-field label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#7090b0;display:block;margin-bottom:4px;}
.ap-req{color:#E74C3C;margin-left:2px;}
.ap-opt{color:#b0c4d8;font-size:9px;margin-left:3px;font-style:italic;}
.ap-section{font-family:'DM Mono';font-size:8px;letter-spacing:2px;text-transform:uppercase;color:#9ab0c8;margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid #f0f5fb;}
.ap-id{background:#f4f7fc;border:1px solid #dde6f0;border-radius:7px;padding:7px 12px;font-family:'DM Mono';font-size:12px;color:#9ab0c8;margin-bottom:14px;}
.ap-id strong{color:#0a1628;}
.ap-actions{display:flex;gap:10px;margin-top:16px;}
.btn-ap-save{flex:1;padding:12px;border-radius:9px;background:linear-gradient(135deg,#C9933A,#e0a840);color:#0a1628;font-size:13px;font-weight:700;border:none;cursor:pointer;font-family:'DM Sans';}
.btn-ap-cancel{padding:12px 18px;border-radius:9px;background:#f0f5fb;color:#5a7090;font-size:12px;font-weight:600;border:none;cursor:pointer;font-family:'DM Sans';}
.ap-status{font-size:11px;color:#1a7a44;margin-top:8px;display:none;text-align:center;}
.alert{border-radius:9px;padding:9px 13px;font-size:12px;margin-bottom:12px;display:none;}
.alert.ok{background:#E8F8EE;border:1px solid #c8e8d0;color:#1a7a44;}
.alert.warn{background:#FFF8E0;border:1px solid #e8c870;color:#865a10;}
.alert.err{background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.25);color:#c0392b;}
.empty{text-align:center;padding:40px 20px;color:#b0c4d8;}
.empty-icon{font-size:36px;margin-bottom:10px;opacity:.4;}
.rk-status-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.rk-dot{width:6px;height:6px;border-radius:50%;background:#27AE60;flex-shrink:0;}
.rk-dot.rk-spin{background:#C9933A;animation:rkpulse .7s ease infinite alternate;}
@keyframes rkpulse{to{opacity:.3;}}
.rk-stxt{font-family:'DM Mono';font-size:10px;color:#9ab0c8;letter-spacing:1px;}
.rk-sec{font-family:'DM Mono';font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#9ab0c8;margin:16px 0 10px;display:flex;align-items:center;gap:10px;}
.rk-sec::after{content:'';flex:1;height:1px;background:#dde6f0;}
.rk-kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
.rk-kpi{background:#fff;border:1px solid #dde6f0;border-radius:12px;padding:12px 14px;}
.rk-kpi-v{font-family:'Bebas Neue';font-size:28px;color:#0a1628;line-height:1;}
.rk-kpi-v.gold{color:#C9933A;}
.rk-kpi-l{font-family:'DM Mono';font-size:9px;color:#9ab0c8;letter-spacing:2px;text-transform:uppercase;margin-top:4px;}
.rk-kpi-sub{font-size:10px;color:#7090b0;margin-top:1px;font-weight:300;}
.cb-band{background:#fff;border:1px solid #dde6f0;border-radius:12px;padding:16px 18px;margin-bottom:16px;}
.cb-band-title{font-family:'Bebas Neue';font-size:16px;letter-spacing:1px;color:#0a1628;margin-bottom:3px;}
.cb-band-sub{font-size:11px;color:#9ab0c8;margin-bottom:14px;}
.rk-period-tabs{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap;}
.rk-ptab{padding:4px 12px;border-radius:20px;font-family:'DM Mono';font-size:9px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border:1px solid #dde6f0;background:#f4f7fc;color:#7090b0;transition:all .15s;}
.rk-ptab:hover{border-color:#C9933A;color:#C9933A;}
.rk-ptab.on{background:#0a1628;color:#fff;border-color:#0a1628;}
.rk-crows{display:flex;flex-direction:column;gap:6px;}
.rk-crow{display:grid;grid-template-columns:130px 1fr 70px 65px;align-items:center;gap:10px;}
.rk-cname{font-size:12px;font-weight:600;color:#0d1e3a;display:flex;align-items:center;gap:6px;}
.rk-bar-wrap{position:relative;height:7px;background:#f0f5fb;border-radius:4px;overflow:visible;}
.rk-bar-avg{position:absolute;top:-3px;width:2px;height:13px;background:#0a1628;border-radius:1px;z-index:2;}
.rk-bar-fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.22,.68,0,1.2);}
.rk-cwr{font-family:'DM Mono';font-size:11px;text-align:right;}
.rk-cscore{font-family:'DM Mono';font-size:10px;font-weight:600;text-align:right;padding:2px 7px;border-radius:5px;}
.rk-avg-ind{display:flex;align-items:center;gap:7px;margin-top:10px;font-family:'DM Mono';font-size:9px;color:#9ab0c8;}
.rk-avg-line{width:16px;height:2px;background:#0a1628;border-radius:1px;}
.rk-sort-bar{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap;}
.rk-sbtn{padding:5px 12px;border-radius:7px;font-family:'DM Mono';font-size:9px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border:1px solid #dde6f0;background:#fff;color:#9ab0c8;transition:all .15s;}
.rk-sbtn:hover{border-color:#C9933A;color:#C9933A;}
.rk-sbtn.on{background:#0a1628;color:#fff;border-color:#0a1628;}
.rk-tbl{background:#fff;border:1px solid #dde6f0;border-radius:12px;overflow:hidden;}
.rk-thd{display:grid;grid-template-columns:40px 1fr 44px 44px 44px 44px 64px 52px 64px;padding:8px 14px;background:#f4f7fc;border-bottom:1px solid #dde6f0;}
.rk-th{font-family:'DM Mono';font-size:9px;color:#9ab0c8;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;}
.rk-th.r{justify-content:flex-end;}
.rk-th.on{color:#C9933A;}
.rk-prow{display:grid;grid-template-columns:40px 1fr 44px 44px 44px 44px 64px 52px 64px;padding:10px 14px;border-bottom:1px solid #eaf0f8;align-items:center;transition:background .12s;animation:rowIn .25s ease both;}
.rk-prow:last-child{border-bottom:none;}
.rk-prow:hover{background:#f8fafd;}
.rk-rank{font-family:'Bebas Neue';font-size:18px;color:#9ab0c8;}
.rk-rank.g{color:#d4a017;}.rk-rank.s{color:#8a9ab0;}.rk-rank.b{color:#b07040;}
.rk-player{display:flex;align-items:center;gap:8px;}
.rk-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';font-size:12px;color:#fff;flex-shrink:0;}
.rk-pname{font-size:12px;font-weight:700;color:#0d1e3a;}
.rk-psess{font-family:'DM Mono';font-size:9px;color:#9ab0c8;}
.rk-tn{font-family:'DM Mono';font-size:11px;color:#0d1e3a;text-align:right;}
.rk-tn.dim{color:#9ab0c8;}.rk-tn.em{color:#0a1628;font-weight:600;}
.rk-wr-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.rk-wr-val{font-family:'DM Mono';font-size:11px;font-weight:600;}
.rk-wr-bar{width:38px;height:3px;background:#eaf0f8;border-radius:2px;overflow:hidden;}
.rk-wr-fill{height:100%;border-radius:2px;}
.rk-gd{font-family:'DM Mono';font-size:11px;text-align:right;font-weight:600;}
.rk-mvp{display:inline-flex;align-items:center;gap:3px;background:#FFF8E0;border:1px solid rgba(201,147,58,.25);border-radius:5px;padding:2px 7px;font-family:'DM Mono';font-size:9px;color:#C9933A;justify-self:flex-end;}
.rk-mvp.z{opacity:0;}
.rk-sh{background:rgba(201,147,58,.04);}
.rk-upd{margin-top:12px;font-family:'DM Mono';font-size:9px;color:#b0c4d8;text-align:right;}
.rk-ref-btn{background:#fff;border:1px solid #dde6f0;border-radius:7px;color:#9ab0c8;cursor:pointer;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .2s;}
.rk-ref-btn:hover{border-color:#C9933A;color:#C9933A;}
.rk-ref-btn.spin{animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(max-width:480px){
  .team-row{grid-template-columns:1fr auto 1fr;}
  .player-grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));}
  .save-summary{grid-template-columns:repeat(3,1fr);}
  .rk-kpi-grid{grid-template-columns:repeat(2,1fr);}
  .rk-thd,.rk-prow{grid-template-columns:32px 1fr 48px 52px 56px;}
  .rk-hide{display:none;}
  .rk-crow{grid-template-columns:110px 1fr 55px;}
  .rk-cscore{display:none;}
}

/* ══ CADASTRO DE JOGADORES — V38 pattern ══ */
.player-roster{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.roster-card{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #dde6f0;border-radius:12px;padding:12px 16px;transition:box-shadow .2s;}
.roster-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.06);}
.roster-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';font-size:16px;flex-shrink:0;}
.roster-info{flex:1;}
.roster-name{font-size:14px;font-weight:700;color:#0d1e3a;}
.roster-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.roster-tag{font-size:10px;padding:1px 7px;border-radius:99px;background:#f0f5fb;color:#5a7090;}
.roster-id{font-family:'DM Mono';font-size:10px;color:#b0c4d8;}
.btn-add-player-v10{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:10px;background:#0a1628;color:#fff;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans';transition:all .2s;}
.btn-add-player-v10:hover{background:#132240;}
.db-search-wrap{position:relative;display:flex;align-items:center;}
.db-search-wrap svg{position:absolute;left:12px;color:#b0c4d8;pointer-events:none;}
.db-search{width:100%;padding:9px 12px 9px 36px;background:#f4f7fc;border:1px solid #dde6f0;border-radius:9px;font-size:13px;font-family:'DM Sans';color:#0d1e3a;outline:none;transition:border-color .2s;}
.db-search:focus{border-color:#3a7bd5;background:#fff;}
.card-badge{font-family:'DM Mono';font-size:10px;color:#7090b0;background:#f0f5fb;padding:4px 10px;border-radius:20px;border:1px solid #dde6f0;}

/* ── MOBILE RESPONSIVE ───────────────────────────────────────── */
.hamburger{display:none;background:none;border:none;cursor:pointer;padding:8px;flex-direction:column;gap:5px;}
.hamburger span{display:block;width:22px;height:2px;background:#0a1628;border-radius:99px;transition:all .3s;}
.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(10,22,40,.5);z-index:150;}
.sidebar-overlay.on{display:block;}

@media (max-width: 768px) {
  .hamburger{display:flex;}
  .sidebar-nav{
    position:fixed;left:-240px;top:52px;height:calc(100vh - 52px);
    z-index:200;transition:left .3s cubic-bezier(.4,0,.2,1);
    box-shadow:4px 0 20px rgba(10,22,40,.15);
  }
  .sidebar-nav.open{left:0;}
  .main-content{margin-left:0 !important;width:100%;}
  body > .screen:not(#s-login){flex-direction:column;}
  .topbar-center{display:none;}
  .card{border-radius:10px;padding:14px;}
  .match-item{flex-direction:column;gap:8px;padding:12px;}
  .match-team{justify-content:center;text-align:center;}
  .match-score{order:-1;}
  .random-preview-item{flex-wrap:wrap;}
}

@media (max-width: 480px) {
  .topbar{padding:0 10px;}
  .topbar-logo{font-size:16px;}
  body .card-grid, body .match-selectors{grid-template-columns:1fr;}
  .player-chip{font-size:11px;}
}


/* ══ SPLASH SCREEN ══════════════════════════════════════════════════════════ */
#s-splash{background:linear-gradient(160deg,#1a6fa8 0%,#1e90d4 40%,#25a8f0 70%,#1ecde0 100%);position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden}
#s-splash::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:36px 36px;animation:splashGrid 1s ease forwards}
@keyframes splashGrid{from{opacity:0}to{opacity:1}}
.splash-orb-b{position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(99,179,237,.16) 0%,transparent 70%);animation:splashPulse 2.5s ease-in-out infinite}
@keyframes splashPulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.1);opacity:1}}
.splash-ring-b{position:absolute;border-radius:50%;width:130px;height:130px;border:1px solid rgba(99,179,237,.16);animation:splashRing 2.2s ease-out infinite}
.splash-ring-b:nth-child(2){animation-delay:.7s}.splash-ring-b:nth-child(3){animation-delay:1.4s}
@keyframes splashRing{0%{transform:scale(.8);opacity:.7}100%{transform:scale(2.6);opacity:0}}
.splash-court-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.splash-logo-b{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.splash-word-padel-b{font-family:'Bebas Neue',sans-serif;font-size:72px;letter-spacing:14px;color:#fff;line-height:1;opacity:0;transform:translateY(18px);animation:splashUp .6s cubic-bezier(.16,1,.3,1) .35s forwards}
.splash-word-eye-b{font-family:'Bebas Neue',sans-serif;font-size:72px;letter-spacing:14px;color:#fde68a;line-height:1;position:relative;opacity:0;transform:translateY(18px);animation:splashUp .6s cubic-bezier(.16,1,.3,1) .6s forwards}
.splash-word-eye-b::after{content:'';position:absolute;bottom:-5px;left:0;width:0;height:2px;background:#fde68a;animation:splashLine .5s ease 1s forwards}
@keyframes splashLine{to{width:100%}}
@keyframes splashUp{to{opacity:1;transform:translateY(0)}}
.splash-tag-b{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.28);margin-top:20px;opacity:0;animation:splashFade .5s ease 1.1s forwards}
.splash-byline-b{position:absolute;bottom:28px;z-index:2;display:flex;flex-direction:column;align-items:center;gap:4px;opacity:0;animation:splashFade .5s ease 1.35s forwards}
.splash-by-powered{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.4)}
.splash-by-brand{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:4px;color:#bfdbfe}
.splash-by-loc{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.3)}
@keyframes splashFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.splash-bar-wrap-b{position:absolute;bottom:0;left:0;right:0;height:2px;background:rgba(255,255,255,.06)}
.splash-bar-b{height:100%;width:0;background:linear-gradient(90deg,rgba(255,255,255,.6),#fff);animation:splashBar 2.8s cubic-bezier(.4,0,.2,1) .2s forwards}
@keyframes splashBar{0%{width:0}30%{width:45%}70%{width:75%}90%{width:92%}100%{width:100%}}
#s-splash.splash-exit{animation:splashOut .5s ease forwards}
@keyframes splashOut{to{opacity:0;transform:scale(1.03)}}
</style>
