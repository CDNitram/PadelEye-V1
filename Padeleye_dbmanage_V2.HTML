<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelEye · DB Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#f5f5f5;color:#1a1a2e;font-family:'DM Sans',sans-serif;font-size:13px;overflow:hidden;}

.topbar{background:#ffffff;border-bottom:1px solid #e0e0e0;padding:0 20px;height:48px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.brand{font-family:'Bebas Neue';font-size:20px;letter-spacing:2px;color:#1a1a2e;}
.brand em{color:#C9933A;font-style:normal;}
.brand sub{font-family:'DM Mono';font-size:9px;color:#999;letter-spacing:1px;margin-left:8px;vertical-align:middle;}
.conn-pill{display:flex;align-items:center;gap:6px;font-family:'DM Mono';font-size:10px;color:#888;}
.dot{width:7px;height:7px;border-radius:50%;background:#ccc;flex-shrink:0;}
.dot.ok{background:#3fb950;box-shadow:0 0 5px #3fb95055;}
.dot.err{background:#f85149;}
.dot.spin{background:#d29922;animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.url-bar{background:#fff;border-bottom:1px solid #ebebeb;padding:6px 20px;display:flex;align-items:center;gap:8px;font-family:'DM Mono';font-size:10px;color:#aaa;flex-shrink:0;}
.url-val{color:#999;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.url-btn{background:none;border:1px solid #e0e0e0;color:#999;font-family:'DM Mono';font-size:9px;padding:3px 8px;border-radius:4px;cursor:pointer;letter-spacing:.5px;}
.url-btn:hover{border-color:#C9933A;color:#C9933A;}

.layout{display:flex;height:calc(100vh - 80px);}

/* SIDEBAR */
.sidebar{width:190px;background:#ffffff;border-right:1px solid #e8e8e8;overflow-y:auto;flex-shrink:0;padding:8px 0;}
.sec-lbl{padding:8px 14px 3px;font-family:'DM Mono';font-size:8px;letter-spacing:2px;color:#bbb;text-transform:uppercase;}
.nav-btn{width:100%;display:flex;align-items:center;gap:8px;padding:7px 14px;background:none;border:none;border-left:2px solid transparent;cursor:pointer;color:#888;font-family:'DM Sans';font-size:12px;font-weight:500;text-align:left;transition:all .12s;}
.nav-btn:hover{background:#f7f7f7;color:#1a1a2e;}
.nav-btn.on{background:#fdf6ec;color:#C9933A;border-left-color:#C9933A;}
.nav-btn .ico{font-size:13px;width:16px;text-align:center;flex-shrink:0;}
.nav-badge{margin-left:auto;font-family:'DM Mono';font-size:9px;background:#f0f0f0;padding:1px 6px;border-radius:99px;color:#aaa;}
.nav-btn.on .nav-badge{background:rgba(201,147,58,.12);color:#C9933A;}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}

.toolbar{padding:10px 16px;border-bottom:1px solid #ebebeb;display:flex;align-items:center;gap:8px;background:#ffffff;flex-shrink:0;flex-wrap:wrap;}
.tbl-title{font-family:'Bebas Neue';font-size:18px;letter-spacing:1px;color:#1a1a2e;}
.tbl-count{font-family:'DM Mono';font-size:10px;color:#999;background:#f0f0f0;padding:2px 8px;border-radius:99px;}
.srch{flex:1;max-width:260px;background:#f5f5f5;border:1px solid #e0e0e0;border-radius:5px;color:#1a1a2e;font-family:'DM Sans';font-size:12px;padding:6px 10px;outline:none;}
.srch:focus{border-color:#C9933A;background:#fff;}
.srch::placeholder{color:#bbb;}
.btn{padding:6px 12px;border-radius:5px;font-family:'DM Sans';font-size:11px;font-weight:600;cursor:pointer;border:1px solid;transition:all .12s;white-space:nowrap;}
.btn-go{background:#238636;border-color:#2ea043;color:#fff;}
.btn-go:hover{background:#2ea043;}
.btn-sec{background:transparent;border-color:#ddd;color:#888;}
.btn-sec:hover{border-color:#999;color:#333;}
.ml{margin-left:auto;}

/* TABLE */
.tbl-wrap{flex:1;overflow:auto;background:#fff;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead{position:sticky;top:0;z-index:5;background:#fafafa;}
thead tr{border-bottom:2px solid #e8e8e8;}
th{padding:8px 10px;text-align:left;font-family:'DM Mono';font-size:8px;letter-spacing:1.5px;color:#bbb;text-transform:uppercase;white-space:nowrap;}
tbody tr{border-bottom:1px solid #f0f0f0;transition:background .1s;}
tbody tr:hover{background:#fdf6ec;}
tbody tr.editing{background:#fffbf5;box-shadow:inset 0 0 0 1px #C9933A;}
td{padding:7px 10px;color:#333;vertical-align:middle;max-width:200px;}

.cv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.mono{font-family:'DM Mono';font-size:10px;color:#888;}
.cid{font-family:'DM Mono';font-size:10px;color:#C9933A;}
.chip{display:inline-block;padding:1px 7px;border-radius:99px;font-size:10px;font-weight:600;font-family:'DM Mono';}
.chip-g{background:rgba(63,185,80,.1);color:#2a9a42;}
.chip-o{background:rgba(201,147,58,.1);color:#b07a1a;}
.chip-b{background:rgba(59,130,246,.1);color:#2563eb;}
.chip-x{background:#f0f0f0;color:#999;}

/* EDIT CONTROLS */
.ei{width:100%;background:#fff;border:1px solid #C9933A;border-radius:3px;color:#1a1a2e;font-family:'DM Sans';font-size:11px;padding:3px 6px;outline:none;}
.ei:focus{box-shadow:0 0 0 2px rgba(201,147,58,.15);}
.es{width:100%;background:#fff;border:1px solid #C9933A;border-radius:3px;color:#1a1a2e;font-family:'DM Sans';font-size:11px;padding:3px 6px;outline:none;}

.ac{display:flex;gap:4px;align-items:center;}
.btn-ed{padding:3px 8px;border-radius:3px;font-size:9px;font-weight:600;cursor:pointer;border:1px solid #e0e0e0;background:transparent;color:#aaa;font-family:'DM Mono';transition:all .12s;white-space:nowrap;}
.btn-ed:hover{border-color:#C9933A;color:#C9933A;}
.btn-sv{padding:3px 8px;border-radius:3px;font-size:9px;font-weight:700;cursor:pointer;border:1px solid #2ea043;background:#238636;color:#fff;font-family:'DM Mono';white-space:nowrap;}
.btn-sv:hover{background:#2ea043;}
.btn-cx{padding:3px 8px;border-radius:3px;font-size:9px;cursor:pointer;border:1px solid #e0e0e0;background:transparent;color:#aaa;font-family:'DM Mono';white-space:nowrap;}
.btn-cx:hover{color:#333;border-color:#999;}
.btn-ro{color:#ccc;font-size:9px;font-family:'DM Mono';font-style:italic;}

/* HEALTH CHECK PANEL */
.health-wrap{flex:1;overflow:auto;padding:20px;}
.health-card{background:#fff;border:1px solid #e8e8e8;border-radius:8px;padding:20px;max-width:480px;}
.health-title{font-family:'Bebas Neue';font-size:16px;letter-spacing:1px;color:#1a1a2e;margin-bottom:4px;}
.health-sub{font-family:'DM Mono';font-size:10px;color:#bbb;margin-bottom:20px;}
.health-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f5f5f5;}
.health-row:last-child{border-bottom:none;}
.health-lbl{font-size:12px;color:#555;}
.health-val{font-family:'DM Mono';font-size:11px;}
.hv-ok{color:#3fb950;}
.hv-err{color:#f85149;}
.hv-spin{color:#d29922;}
.btn-ping{margin-top:16px;width:100%;padding:9px;background:#1a1a2e;border:none;border-radius:6px;color:#fff;font-family:'Bebas Neue';letter-spacing:1.5px;font-size:14px;cursor:pointer;transition:background .15s;}
.btn-ping:hover{background:#2d2d4a;}

/* EMPTY / LOADER */
.ctr{display:flex;align-items:center;justify-content:center;flex:1;flex-direction:column;gap:10px;color:#ccc;}
.spin{width:18px;height:18px;border:2px solid #e8e8e8;border-top-color:#C9933A;border-radius:50%;animation:rot .7s linear infinite;}
@keyframes rot{to{transform:rotate(360deg)}}
.empty-ico{font-size:32px;opacity:.3;}

/* VERSION BADGE */
.ver-badge{font-family:'DM Mono';font-size:8px;color:#ddd;padding:10px 14px 4px;letter-spacing:1px;}

/* TOAST */
#toast{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:6px;pointer-events:none;}
.ti{padding:9px 16px;border-radius:7px;font-size:11px;font-weight:600;animation:sup .2s ease;font-family:'DM Sans';max-width:300px;}
@keyframes sup{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.ti-ok{background:#edfbf0;border:1px solid #3fb950;color:#2a9a42;}
.ti-er{background:#fef2f2;border:1px solid #f85149;color:#dc2626;}
.ti-wa{background:#fffbeb;border:1px solid #d29922;color:#b45309;}
.ti-in{background:#eff6ff;border:1px solid #388bfd;color:#2563eb;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">PADEL<em>EYE</em><sub>DB MANAGER V2</sub></div>
  <div class="conn-pill">
    <div class="dot" id="dot"></div>
    <span id="conn-lbl">Desconectado</span>
  </div>
</div>

<div class="url-bar">
  <span>🔗</span>
  <span class="url-val" id="url-disp">—</span>
  <button class="url-btn" onclick="editURL()">✏️ URL</button>
  <button class="url-btn" onclick="loadAll()">↺ Reconectar</button>
</div>

<div class="layout">
  <nav class="sidebar">
    <div class="sec-lbl">Torneios</div>
    <button class="nav-btn on" onclick="go('torneios',this)" id="nb-torneios">
      <span class="ico">🏆</span>Torneios<span class="nav-badge" id="bd-torneios">—</span>
    </button>
    <button class="nav-btn" onclick="go('partidas_torneios',this)" id="nb-partidas_torneios">
      <span class="ico">🏸</span>Partidas<span class="nav-badge" id="bd-partidas_torneios">—</span>
    </button>
    <button class="nav-btn" onclick="go('scorecard',this)" id="nb-scorecard">
      <span class="ico">📋</span>Scorecard<span class="nav-badge" id="bd-scorecard">—</span>
    </button>
    <button class="nav-btn" onclick="go('ranking_torneios',this)" id="nb-ranking_torneios">
      <span class="ico">📊</span>Ranking<span class="nav-badge" id="bd-ranking_torneios">—</span>
    </button>
    <div class="sec-lbl">Global</div>
    <button class="nav-btn" onclick="go('jogadores',this)" id="nb-jogadores">
      <span class="ico">👤</span>Jogadores<span class="nav-badge" id="bd-jogadores">—</span>
    </button>
    <div class="sec-lbl">Sistema</div>
    <button class="nav-btn" onclick="go('log',this)" id="nb-log">
      <span class="ico">🪵</span>Log / Health<span class="nav-badge" id="bd-log">—</span>
    </button>
    <div class="ver-badge">V2 · fix: URL + actions</div>
  </nav>

  <div class="main" id="main">
    <div class="ctr"><div class="spin"></div><span>A conectar...</span></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ════════════════════════════════════════════════
// CONFIG — V2 fixes:
//   1. URL corrigida (era AKfycbwq..., agora AKfycbxI... = mesmo endpoint do Prod)
//   2. get_scorecard → get_scorecard_torneios
//   3. get_log removido (sem GET handler) → substituído por painel health/ping
//   4. 4 tabelas Sessões removidas (módulo Mark Zero / script diferente)
// ════════════════════════════════════════════════
let URL_BASE = localStorage.getItem('pe_dbm_url') ||
  'https://script.google.com/macros/s/AKfycbxIMEFN3nTVDA-LY2aP_w2Hu3RZlgbDVvKz0zI5DfW9HtT_d9PqzLYLBMkc5Q5ORY7WQg/exec';

document.getElementById('url-disp').textContent = URL_BASE;

// ── TABLE DEFINITIONS (exact Apps Script action names) ───────────────────
const TABLES = {

  jogadores: {
    sheet: 'Jogadores', get: 'get_jogadores', key: 'jogador_id', readonly: false,
    cols: [
      { k:'jogador_id',    l:'ID',        ro:true },
      { k:'nome',          l:'Nome' },
      { k:'sobrenome',     l:'Sobrenome' },
      { k:'apelido',       l:'Apelido' },
      { k:'categoria',     l:'Cat',   sel:['8a','7a','6a','5a'] },
      { k:'genero',        l:'Género', sel:['Masculino','Feminino'] },
      { k:'cidade',        l:'Cidade' },
      { k:'nacionalidade', l:'Nac.' },
      { k:'clube',         l:'Clube' },
      { k:'email',         l:'Email' },
      { k:'celular',       l:'Cel.' },
      { k:'ativo',         l:'Ativo',  sel:['TRUE','FALSE'] },
      { k:'criado_em',     l:'Criado', ro:true },
    ],
  },

  torneios: {
    sheet: 'Torneios', get: 'get_torneios', key: 'torneio_id', readonly: false,
    cols: [
      { k:'torneio_id',          l:'ID',        ro:true },
      { k:'nome',                l:'Nome' },
      { k:'data',                l:'Data' },
      { k:'local',               l:'Local' },
      { k:'formato',             l:'Formato' },
      { k:'num_grupos',          l:'Grupos' },
      { k:'jogadores_por_grupo', l:'Jog/Grp' },
      { k:'num_fases',           l:'Fases' },
      { k:'categoria',           l:'Cat',   sel:['8a','7a','6a','5a'] },
      { k:'status',              l:'Status', sel:['em_curso','finalizado','cancelado'] },
      { k:'criado_em',           l:'Criado', ro:true },
    ],
  },

  partidas_torneios: {
    sheet: 'Partidas_Torneios', get: 'get_partidas_torneios', key: 'partida_id', readonly: false,
    cols: [
      { k:'partida_id', l:'ID',       ro:true },
      { k:'torneio_id', l:'Torneio',  ro:true },
      { k:'fase',       l:'Fase' },
      { k:'grupo',      l:'Grupo' },
      { k:'partida',    l:'Nº' },
      { k:'equipa_a',   l:'Equipa A' },
      { k:'equipa_b',   l:'Equipa B' },
      { k:'score_a',    l:'A' },
      { k:'score_b',    l:'B' },
      { k:'tie_break',  l:'TB',    sel:['Não','Sim'] },
      { k:'tb_a',       l:'TB A' },
      { k:'tb_b',       l:'TB B' },
      { k:'vencedor',   l:'Vencedor' },
      { k:'saved_at',   l:'Saved',  ro:true },
    ],
  },

  scorecard: {
    // V2 fix: era 'get_scorecard', correcto é 'get_scorecard_torneios'
    sheet: 'Scorecard_Torneios', get: 'get_scorecard_torneios', key: 'id', readonly: false,
    cols: [
      { k:'id',           l:'ID',      ro:true },
      { k:'torneio_id',   l:'Torneio', ro:true },
      { k:'jogador',      l:'Jogador' },
      { k:'posicao',      l:'Pos.' },
      { k:'fase_atingida',l:'Fase' },
      { k:'pts_base',     l:'Base' },
      { k:'pts_bonus',    l:'Bónus' },
      { k:'pts_total',    l:'Total' },
      { k:'torneio_nome', l:'Nome Torneio' },
      { k:'data',         l:'Data' },
    ],
  },

  ranking_torneios: {
    sheet: 'Ranking_Torneios', get: 'get_ranking_torneios', key: 'jogador', readonly: false,
    cols: [
      { k:'jogador',     l:'Jogador' },
      { k:'pts_total',   l:'Pts' },
      { k:'torneios',    l:'T' },
      { k:'titulos',     l:'🥇' },
      { k:'vices',       l:'🥈' },
      { k:'partidas',    l:'P' },
      { k:'vitorias',    l:'V' },
      { k:'derrotas',    l:'D' },
      { k:'gf',          l:'GF' },
      { k:'ga',          l:'GA' },
      { k:'gd',          l:'GD' },
      { k:'win_rate',    l:'Win%' },
      { k:'ultima_data', l:'Última' },
      { k:'updated_at',  l:'Updated', ro:true },
    ],
  },

  // V2: Log é painel de health check — sem GET handler no Apps Script
  log: { sheet: 'Log_Torneios', get: '__health__', key: null, readonly: true, cols: [] },

};

// ════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════
let data     = {};
let active   = 'torneios';
let editRow  = null;
let query    = '';
let pingResult = null;

// ════════════════════════════════════════════════
// NETWORK
// ════════════════════════════════════════════════
async function post(action, payload) {
  const res = await fetch(URL_BASE, {
    method:  'POST',
    headers: { 'Content-Type': 'text/plain' },
    body:    JSON.stringify({ action, data: payload, timestamp: new Date().toISOString() })
  });
  const txt = await res.text();
  try { return JSON.parse(txt); } catch { return { ok: false, raw: txt }; }
}

async function get(action) {
  const res = await fetch(`${URL_BASE}?action=${action}`);
  const txt = await res.text();
  try { return JSON.parse(txt); } catch { return { rows: [], raw: txt }; }
}

async function ping() {
  const t0  = Date.now();
  const res = await fetch(`${URL_BASE}?action=ping`);
  const ms  = Date.now() - t0;
  const txt = await res.text();
  let parsed;
  try { parsed = JSON.parse(txt); } catch { parsed = { ok: false, raw: txt }; }
  return { ...parsed, ms };
}

// ════════════════════════════════════════════════
// LOAD ALL
// ════════════════════════════════════════════════
async function loadAll() {
  if (!URL_BASE) { toast('Cole a URL do Apps Script primeiro', 'wa'); return; }
  setConn('spin', 'A carregar...');
  render('<div class="ctr"><div class="spin"></div><span>A carregar tabelas...</span></div>');

  // Ping first
  try {
    pingResult = await ping();
  } catch(e) {
    pingResult = { ok: false, error: e.message, ms: null };
  }
  document.getElementById('bd-log').textContent = pingResult?.ok ? '✅' : '❌';

  let ok = 0;
  const dataKeys = Object.entries(TABLES).filter(([,cfg]) => cfg.get !== '__health__');
  for (const [k, cfg] of dataKeys) {
    try {
      const r = await get(cfg.get);
      data[k] = r.rows || [];
      document.getElementById('bd-' + k).textContent = data[k].length;
      ok++;
    } catch {
      data[k] = [];
      document.getElementById('bd-' + k).textContent = '⚠';
    }
  }

  const total = dataKeys.length;
  setConn(ok === total ? 'ok' : ok > 0 ? 'spin' : 'err',
          ok + '/' + total + ' tabelas');
  drawTab(active);
  toast('✅ ' + ok + '/' + total + ' tabelas carregadas', ok === total ? 'ok' : 'wa');
}

// ════════════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════════════
function go(k, btn) {
  active  = k;
  editRow = null;
  query   = '';
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  drawTab(k);
}

// ════════════════════════════════════════════════
// RENDER TABLE / HEALTH
// ════════════════════════════════════════════════
function drawTab(k) {
  if (k === 'log') { drawHealth(); return; }

  const cfg  = TABLES[k];
  const rows = data[k] || [];
  const q    = query.toLowerCase();
  const filt = q ? rows.filter(r => Object.values(r).some(v => String(v).toLowerCase().includes(q))) : rows;

  let html = `
  <div class="toolbar">
    <div class="tbl-title">${cfg.sheet}</div>
    <div class="tbl-count">${filt.length} / ${rows.length}</div>
    <input class="srch" placeholder="Pesquisar..." value="${query}"
      oninput="query=this.value;drawTab('${k}')">
    <button class="btn btn-sec ml" onclick="reload('${k}')">↺</button>
  </div>
  <div class="tbl-wrap">`;

  if (!rows.length) {
    html += `<div class="ctr"><div class="empty-ico">📭</div><span>Sem dados · Verifique a ligação</span></div>`;
    html += `</div>`;
    render(html);
    return;
  }

  html += `<table><thead><tr>`;
  cfg.cols.forEach(c => { html += `<th>${c.l}</th>`; });
  html += `<th style="width:110px">Ações</th></tr></thead><tbody>`;

  filt.forEach(row => {
    const rk   = String(row[cfg.key] ?? '');
    const isEd = editRow === rk && rk !== '';
    html += `<tr class="${isEd ? 'editing' : ''}">`;

    cfg.cols.forEach(c => {
      const v = row[c.k] ?? '';
      if (isEd && !c.ro) {
        if (c.sel) {
          html += `<td><select class="es" id="e-${rk}-${c.k}">`;
          c.sel.forEach(o => { html += `<option${String(v)===o?' selected':''}>${o}</option>`; });
          html += `</select></td>`;
        } else {
          const sv = String(v).replace(/"/g,'&quot;');
          html += `<td><input class="ei" id="e-${rk}-${c.k}" value="${sv}"></td>`;
        }
      } else {
        html += `<td>${fmt(v, c.k)}</td>`;
      }
    });

    if (isEd) {
      html += `<td><div class="ac">
        <button class="btn-sv" onclick="save('${k}','${rk}')">✓ Guardar</button>
        <button class="btn-cx" onclick="editRow=null;drawTab('${k}')">✗</button>
      </div></td>`;
    } else if (cfg.readonly) {
      html += `<td><span class="btn-ro">read-only</span></td>`;
    } else {
      html += `<td><div class="ac">
        <button class="btn-ed" onclick="startEdit('${k}','${rk}')">✏️ Editar</button>
      </div></td>`;
    }

    html += `</tr>`;
  });

  html += `</tbody></table></div>`;
  render(html);
}

function drawHealth() {
  const p   = pingResult;
  const ok  = p?.ok;
  const ms  = p?.ms != null ? p.ms + ' ms' : '—';
  const err = p?.error || p?.raw || '—';

  const html = `
  <div class="toolbar">
    <div class="tbl-title">Log · Health Check</div>
    <button class="btn btn-sec ml" onclick="runPing()">↺ Pingar</button>
  </div>
  <div class="health-wrap">
    <div class="health-card">
      <div class="health-title">Apps Script · Status</div>
      <div class="health-sub">action=ping · Log_Torneios</div>
      <div class="health-row">
        <span class="health-lbl">Conexão</span>
        <span class="health-val ${ok?'hv-ok':'hv-err'}" id="hv-status">
          ${ok ? '✅ Online' : p ? '❌ Offline' : '— Não testado'}
        </span>
      </div>
      <div class="health-row">
        <span class="health-lbl">Latência</span>
        <span class="health-val mono" id="hv-ms">${ms}</span>
      </div>
      <div class="health-row">
        <span class="health-lbl">URL</span>
        <span class="health-val mono" style="font-size:9px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${URL_BASE}</span>
      </div>
      ${!ok && p ? `<div class="health-row">
        <span class="health-lbl">Erro</span>
        <span class="health-val" style="color:#f85149;font-size:10px">${err}</span>
      </div>` : ''}
      <button class="btn-ping" onclick="runPing()">🏓 PINGAR APPS SCRIPT</button>
    </div>
    <div style="margin-top:12px;font-family:'DM Mono';font-size:9px;color:#ccc;padding:0 2px;">
      ℹ️ Log_Torneios não tem acção GET — apenas escrita via log_action.
      Para ver entradas de log, aceda directamente ao Google Sheets.
    </div>
  </div>`;
  render(html);
}

async function runPing() {
  render(`<div class="ctr"><div class="spin"></div><span>A pingar...</span></div>`);
  try {
    pingResult = await ping();
  } catch(e) {
    pingResult = { ok: false, error: e.message, ms: null };
  }
  document.getElementById('bd-log').textContent = pingResult?.ok ? '✅' : '❌';
  drawHealth();
  toast(pingResult?.ok ? '✅ Apps Script online · ' + pingResult.ms + 'ms' : '❌ Sem resposta', pingResult?.ok ? 'ok' : 'er');
}

// ════════════════════════════════════════════════
// FORMAT CELLS
// ════════════════════════════════════════════════
function fmt(v, k) {
  if (v === '' || v === null || v === undefined) return `<span style="color:#ddd">—</span>`;
  const s = String(v);
  if (k === 'status') {
    const cls = v==='finalizado'?'chip-g':v==='em_curso'?'chip-o':'chip-x';
    return `<span class="chip ${cls}">${v}</span>`;
  }
  if (k === 'categoria') return `<span class="chip chip-b">${v}</span>`;
  if (k === 'posicao')   return `<span style="font-size:14px">${v}</span>`;
  if (k === 'tie_break' || k === 'tb') return v==='Sim'?`<span class="chip chip-o">🏓 TB</span>`:`<span style="color:#ddd">—</span>`;
  if (k === 'win_rate') {
    const n = parseFloat(v);
    const col = n>=70?'#3fb950':n>=50?'#C9933A':'#f85149';
    return `<span style="color:${col};font-family:'DM Mono';font-size:10px">${v}</span>`;
  }
  if (k === 'gd') {
    const n = parseInt(v);
    const col = n>0?'#3fb950':n<0?'#f85149':'#8b949e';
    return `<span style="color:${col};font-family:'DM Mono';font-size:10px">${n>0?'+':''}${v}</span>`;
  }
  if (k.endsWith('_id') || k === 'id') {
    return `<span class="cid cv" title="${s}">${s.length>26?s.slice(0,26)+'…':s}</span>`;
  }
  if (k.includes('_em') || k.includes('_at') || k === 'timestamp' || k === 'saved_at' || k === 'updated_at' || k === 'ultima_data') {
    try {
      const d = new Date(v);
      if (!isNaN(d)) return `<span class="mono">${d.toLocaleDateString('pt-BR')} ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span>`;
    } catch{}
  }
  if (k === 'equipa_a' || k === 'equipa_b' || k === 'vencedor') {
    return `<span class="cv" style="max-width:160px" title="${s}">${s.length>22?s.slice(0,22)+'…':s}</span>`;
  }
  const num = ['vitorias','derrotas','partidas','gf','ga','sessoes','torneios','titulos','vices','num','score_a','score_b','tb_a','tb_b','pts_total','pts_base','pts_bonus','mvp_count','total_jogadores','total_partidas'];
  if (num.includes(k)) return `<span class="mono">${v}</span>`;
  return `<span class="cv" title="${s}">${s.length>28?s.slice(0,28)+'…':s}</span>`;
}

// ════════════════════════════════════════════════
// EDIT / SAVE
// ════════════════════════════════════════════════
function startEdit(k, rk) {
  editRow = rk;
  drawTab(k);
  setTimeout(() => {
    const el = document.querySelector(`tr.editing .ei, tr.editing .es`);
    el?.focus();
  }, 30);
}

async function save(k, rk) {
  const cfg  = TABLES[k];
  const rows = data[k] || [];
  const orig = rows.find(r => String(r[cfg.key]) === rk);
  if (!orig) { toast('Linha não encontrada', 'er'); return; }

  const updates = {};
  cfg.cols.forEach(c => {
    if (c.ro) return;
    const el = document.getElementById(`e-${rk}-${c.k}`);
    if (el) updates[c.k] = el.value;
  });

  toast('⏳ A guardar...', 'in');
  try {
    const res = await post('update_row', {
      sheet:   cfg.sheet,
      keyCol:  cfg.key,
      keyVal:  rk,
      updates: updates
    });
    if (!res.ok) throw new Error(res.error || 'Erro desconhecido');
    Object.assign(orig, updates);
    editRow = null;
    drawTab(k);
    toast('✅ Guardado com sucesso', 'ok');
  } catch(e) {
    toast('❌ ' + e.message, 'er');
  }
}

// ════════════════════════════════════════════════
// RELOAD SINGLE TAB
// ════════════════════════════════════════════════
async function reload(k) {
  if (k === 'log') { runPing(); return; }
  toast('↺ A recarregar...', 'in');
  try {
    const r = await get(TABLES[k].get);
    data[k] = r.rows || [];
    document.getElementById('bd-' + k).textContent = data[k].length;
    editRow = null;
    drawTab(k);
    toast('✅ ' + data[k].length + ' linhas', 'ok');
  } catch(e) { toast('❌ ' + e.message, 'er'); }
}

// ════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════
function render(html) { document.getElementById('main').innerHTML = html; }

function setConn(state, lbl) {
  const d = document.getElementById('dot');
  d.className = 'dot ' + (state==='ok'?'ok':state==='err'?'err':'spin');
  document.getElementById('conn-lbl').textContent = lbl;
}

function editURL() {
  const u = prompt('Apps Script URL:', URL_BASE);
  if (u && u.trim()) {
    URL_BASE = u.trim();
    localStorage.setItem('pe_dbm_url', URL_BASE);
    document.getElementById('url-disp').textContent = URL_BASE;
    loadAll();
  }
}

function toast(msg, type='in') {
  const c  = document.getElementById('toast');
  const el = document.createElement('div');
  el.className = `ti ti-${type}`;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════
loadAll();
</script>
