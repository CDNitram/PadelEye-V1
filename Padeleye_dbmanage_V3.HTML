<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelEye · DB Manager · V3</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#ffffff;--surface:#fff;--border:#dde6f0;--dark:#0a1628;
  --mid:#1a3052;--accent:#C9933A;--accent2:#e0a840;--blue:#3a7bd5;
  --text:#0d1e3a;--muted:#9ab0c8;--green:#1a7a44;--red:#c0392b;
}
html,body{height:100%;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);background:#fff;}
/* ── LAYOUT ── */
.app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:52px 1fr;height:100vh;}
/* ── TOPBAR ── */
.topbar{grid-column:1/-1;background:#fff;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--border);}
.t-logo{font-family:'Bebas Neue';font-size:22px;color:var(--dark);letter-spacing:1.5px;}
.t-logo em{color:var(--accent);font-style:normal;}
.t-badge{font-family:'DM Mono';font-size:9px;letter-spacing:2px;color:#9ab0c8;padding:3px 8px;border:1px solid var(--border);border-radius:20px;}
.t-url{flex:1;font-family:'DM Mono';font-size:10px;color:#7090b0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:460px;}
.t-conn{display:flex;align-items:center;gap:6px;font-family:'DM Mono';font-size:10px;color:#9ab0c8;}
.t-dot{width:7px;height:7px;border-radius:50%;background:#c0cdd8;}
.t-dot.ok{background:#27AE60;box-shadow:0 0 6px rgba(39,174,96,.4);}
.t-dot.err{background:var(--red);}
.t-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:#f4f7fc;color:#7090b0;font-size:11px;cursor:pointer;font-family:'DM Mono';letter-spacing:1px;transition:all .2s;}
.t-btn:hover{border-color:var(--accent);color:var(--accent);}
/* ── SIDEBAR ── */
.sidebar{background:#fff;padding:12px 0;overflow-y:auto;border-right:1px solid var(--border);}
.sb-section{font-family:'DM Mono';font-size:8px;letter-spacing:2.5px;text-transform:uppercase;color:#b0c4d8;padding:12px 16px 4px;}
.sb-item{display:flex;align-items:center;gap:8px;padding:8px 16px;font-size:12px;font-weight:500;color:#7090b0;cursor:pointer;border-left:2px solid transparent;transition:all .15s;}
.sb-item:hover{color:var(--dark);background:#f4f7fc;}
.sb-item.on{color:var(--dark);border-left-color:var(--accent);background:rgba(201,147,58,.08);font-weight:700;}
.sb-item .sb-ic{font-size:14px;width:18px;text-align:center;}
.sb-item .sb-badge{margin-left:auto;font-family:'DM Mono';font-size:9px;color:#9ab0c8;background:#f0f5fb;padding:1px 6px;border-radius:20px;}
.sb-div{height:1px;background:var(--border);margin:8px 16px;}
/* ── MAIN ── */
.main{overflow-y:auto;padding:20px;}
/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;}
.card-hd{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.card-title{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}
.card-body{padding:16px 18px;}
/* ── TABLE ── */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{font-family:'DM Mono';font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:8px 10px;background:#f8fafd;border-bottom:1px solid var(--border);white-space:nowrap;text-align:left;}
tbody tr{border-bottom:1px solid #f0f5fb;transition:background .1s;}
tbody tr:hover{background:#f8fafd;}
tbody tr:last-child{border:none;}
td{padding:7px 10px;vertical-align:middle;}
td.mono{font-family:'DM Mono';font-size:10px;color:#7090b0;}
td.key{font-family:'DM Mono';font-size:9px;color:#b0c4d8;}
td input,td select{background:#f4f7fc;border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px;font-family:'DM Sans';color:var(--text);width:100%;outline:none;}
td input:focus,td select:focus{border-color:var(--blue);background:#fff;}
.btn-sm{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans';transition:all .15s;}
.btn-edit{background:#f0f5fb;color:#5a7090;}.btn-edit:hover{background:#e0eaf8;color:var(--blue);}
.btn-save{background:var(--blue);color:#fff;}.btn-save:hover{background:#2a6bc0;}
.btn-cancel{background:#f0f5fb;color:#9ab0c8;}
.btn-gold{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--dark);font-weight:700;}
.btn-gold:hover{box-shadow:0 3px 12px rgba(201,147,58,.3);}
/* ── SEARCH ── */
.search-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.search-inp{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 14px;font-size:13px;font-family:'DM Sans';color:var(--text);outline:none;transition:border-color .2s;}
.search-inp:focus{border-color:var(--blue);}
/* ── TOAST ── */
#toast{position:fixed;bottom:24px;right:24px;z-index:9999;padding:11px 18px;border-radius:10px;font-size:12px;font-weight:600;font-family:'DM Sans';box-shadow:0 4px 20px rgba(0,0,0,.2);display:none;animation:slideUp .2s ease;}
#toast.ok{background:#0d2818;color:#4CAF50;border:1px solid #4CAF50;}
#toast.wa{background:#1a1400;color:var(--accent);border:1px solid var(--accent);}
#toast.er{background:#2d0d0d;color:#f97316;border:1px solid #f97316;}
@keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
/* ── SPINNER ── */
.spin{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg)}}
.ctr{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--muted);font-family:'DM Mono';font-size:11px;}
/* ── BADGES ── */
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;font-family:'DM Mono';}
.badge.green{background:#E8F8EE;color:var(--green);}
.badge.gold{background:#FFF8E0;color:#865a10;}
.badge.blue{background:#EBF4FF;color:#1a4a8a;}
.badge.gray{background:#f0f5fb;color:#7090b0;}
.badge.red{background:rgba(231,76,60,.1);color:var(--red);}
/* ── HEALTH ── */
.health-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;}
.health-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.hc-name{font-weight:700;font-size:12px;margin-bottom:2px;}
.hc-rows{font-family:'DM Mono';font-size:22px;color:var(--blue);line-height:1;}
.hc-rows.ok{color:var(--green);}
.hc-rows.er{color:var(--red);}
.hc-sub{font-size:10px;color:var(--muted);margin-top:3px;}
/* ── TOURNAMENT BROWSER ── */
.trn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:20px;}
.trn-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .2s;}
.trn-card:hover{border-color:var(--accent);box-shadow:0 4px 20px rgba(201,147,58,.15);transform:translateY(-2px);}
.trn-card-hd{background:linear-gradient(135deg,var(--dark),var(--mid));padding:16px 18px;}
.trn-card-name{font-family:'Bebas Neue';font-size:18px;color:#fff;letter-spacing:1px;line-height:1.2;}
.trn-card-date{font-family:'DM Mono';font-size:9px;color:#93C5FD;margin-top:4px;letter-spacing:1px;}
.trn-card-body{padding:12px 18px;display:flex;justify-content:space-between;align-items:center;}
.trn-kpis{display:flex;gap:14px;}
.trn-kpi-v{font-family:'Bebas Neue';font-size:18px;color:var(--accent);line-height:1;}
.trn-kpi-l{font-family:'DM Mono';font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
/* ── TOURNAMENT DETAIL ── */
#trn-detail{display:none;}
.trn-detail-hd{background:linear-gradient(135deg,var(--dark),var(--mid));border-radius:14px;padding:20px 22px;margin-bottom:14px;}
.trn-detail-name{font-family:'Bebas Neue';font-size:28px;color:#fff;letter-spacing:2px;}
.trn-detail-meta{font-family:'DM Mono';font-size:10px;color:#93C5FD;margin-top:4px;letter-spacing:1px;}
.trn-detail-kpis{display:flex;gap:20px;margin-top:14px;}
.trn-dk{text-align:center;}
.trn-dk-v{font-family:'Bebas Neue';font-size:22px;color:var(--accent);line-height:1;}
.trn-dk-l{font-family:'DM Mono';font-size:8px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.detail-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:16px;overflow-x:auto;}
.dtab{padding:10px 16px;font-family:'DM Mono';font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .15s;}
.dtab:hover{color:var(--text);}
.dtab.on{color:var(--dark);border-bottom-color:var(--accent);font-weight:700;}
.dpanel{display:none;}.dpanel.on{display:block;}
/* ── GROUP TABLE ── */
.grp-section{margin-bottom:18px;}
.grp-title{font-family:'Bebas Neue';font-size:16px;color:var(--dark);letter-spacing:1px;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.grp-badge{font-family:'DM Mono';font-size:9px;padding:2px 8px;border-radius:20px;background:var(--bg);color:var(--muted);}
/* ── SCORECARD ── */
.sc-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:7px;}
.sc-row.gold{background:linear-gradient(135deg,#fffbf0,#fff8e0);border-color:#e8c870;}
.sc-row.silver{background:linear-gradient(135deg,#f8faff,#f0f4fc);}
.sc-rank{font-size:22px;min-width:32px;text-align:center;}
.sc-av{width:34px;height:34px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';font-size:14px;color:#fff;flex-shrink:0;}
.sc-info{flex:1;}
.sc-name{font-size:13px;font-weight:700;}
.sc-phase{font-size:10px;color:var(--muted);font-family:'DM Mono';}
.sc-pts{font-family:'Bebas Neue';font-size:24px;color:var(--accent);}
/* ── STATS TABLE ── */
.stats-tbl th{background:#f4f7fc;}
/* ── HISTORY TIMELINE ── */
.hist-match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 13px;margin-bottom:7px;}
.hist-team{font-size:12px;font-weight:600;}
.hist-team.right{text-align:right;}
.hist-team.win{color:var(--green);}
.hist-team.lose{color:var(--muted);}
.hist-score{text-align:center;font-family:'Bebas Neue';font-size:18px;letter-spacing:1px;}
.hist-meta{font-family:'DM Mono';font-size:8px;color:var(--muted);text-align:center;margin-top:1px;}
/* ── BACK BUTTON ── */
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-family:'DM Mono';font-size:10px;color:#5a8aaa;cursor:pointer;margin-bottom:14px;transition:all .2s;}
.back-btn:hover{border-color:var(--accent);color:var(--accent);}
@media(max-width:600px){.app{grid-template-columns:1fr;}.sidebar{display:none;}}
</style>
</head>
<body>
<div class="app">

<!-- TOPBAR -->
<div class="topbar">
  <div class="t-logo">PADEL<em>EYE</em></div>
  <div class="t-badge">DB MANAGER · V3</div>
  <div class="t-url" id="url-disp"></div>
  <div class="t-conn">
    <div class="t-dot" id="conn-dot"></div>
    <span id="conn-lbl">—</span>
  </div>
  <button class="t-btn" onclick="editURL()">✏ URL</button>
  <button class="t-btn btn-gold" onclick="loadAll()">⟳ Carregar</button>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sb-section">Torneios</div>
  <div class="sb-item on" id="nav-trn-browser" onclick="go('trn_browser',this)">
    <span class="sb-ic">🏆</span> Torneios
    <span class="sb-badge" id="nb-trn">—</span>
  </div>
  <div class="sb-item" id="nav-tournaments" onclick="go('tournaments',this)">
    <span class="sb-ic">📋</span> Tabela Torneios
  </div>
  <div class="sb-item" id="nav-matches_tournaments" onclick="go('matches_tournaments',this)">
    <span class="sb-ic">🎯</span> Partidas
  </div>
  <div class="sb-item" id="nav-scorecard_tournaments" onclick="go('scorecard_tournaments',this)">
    <span class="sb-ic">🏅</span> Scorecard
  </div>
  <div class="sb-item" id="nav-ranking_tournaments" onclick="go('ranking_tournaments',this)">
    <span class="sb-ic">📊</span> Ranking
  </div>
  <div class="sb-div"></div>
  <div class="sb-section">Sessões</div>
  <div class="sb-item" id="nav-sessions" onclick="go('sessions',this)">
    <span class="sb-ic">📅</span> Sessões
  </div>
  <div class="sb-item" id="nav-matches_sessions" onclick="go('matches_sessions',this)">
    <span class="sb-ic">🏸</span> Partidas
  </div>
  <div class="sb-item" id="nav-stats_sessions" onclick="go('stats_sessions',this)">
    <span class="sb-ic">📈</span> Stats
  </div>
  <div class="sb-item" id="nav-ranking_sessions" onclick="go('ranking_sessions',this)">
    <span class="sb-ic">🥇</span> Ranking
  </div>
  <div class="sb-div"></div>
  <div class="sb-section">Jogadores</div>
  <div class="sb-item" id="nav-players" onclick="go('players',this)">
    <span class="sb-ic">👤</span> Jogadores
  </div>
  <div class="sb-div"></div>
  <div class="sb-section">Sistema</div>
  <div class="sb-item" id="nav-health" onclick="go('health',this)">
    <span class="sb-ic">💚</span> Health Check
  </div>
</div>

<!-- MAIN -->
<div class="main" id="main">
  <div class="ctr"><div class="spin"></div> A inicializar...</div>
</div>

</div><!-- /app -->
<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════════
// PadelEye · DB Manager · V3
// GS V7 unified endpoint — Tournaments + Sessions + Players
// EN schema throughout
// ══════════════════════════════════════════════════════════════════

let URL_BASE = localStorage.getItem('pe_dbm_url') ||
  'https://script.google.com/macros/s/AKfycbweA4wq6I3s7Yed-EixZQXwscL5kvWQD4DgJUBHGgrGWD3bN9NtXUd-_LoSYv60aWXV8Q/exec';

document.getElementById('url-disp').textContent = URL_BASE;

// ── TABLE DEFINITIONS (EN schema · GS V7 action names) ────────────────────
const TABLES = {

  players: {
    label:'Jogadores', sheet:'Players', get:'get_players', key:'player_id', readonly:false,
    cols:[
      { k:'player_id',          l:'ID',        ro:true },
      { k:'player_name',        l:'Nome' },
      { k:'player_surname',     l:'Sobrenome' },
      { k:'player_nickname',    l:'Apelido' },
      { k:'player_category',    l:'Cat',   sel:['8a','7a','6a','5a'] },
      { k:'player_gender',      l:'Gênero', sel:['Masculino','Feminino'] },
      { k:'player_city',        l:'Cidade' },
      { k:'player_nationality', l:'Nac.' },
      { k:'player_club',        l:'Clube' },
      { k:'email',              l:'Email' },
      { k:'mobile_number',      l:'Cel.' },
      { k:'active',             l:'Ativo',  sel:['TRUE','FALSE'] },
      { k:'created_at',         l:'Criado', ro:true },
    ],
  },

  tournaments: {
    label:'Torneios', sheet:'Tournaments', get:'get_tournaments', key:'tournament_id', readonly:false,
    cols:[
      { k:'tournament_id',        l:'ID',        ro:true },
      { k:'tournament_name',      l:'Nome' },
      { k:'date',                 l:'Data' },
      { k:'venue',                l:'Local' },
      { k:'tournament_format',    l:'Formato' },
      { k:'group_number',         l:'Grupos' },
      { k:'players_per_group',    l:'Jog/Grp' },
      { k:'num_phases',           l:'Fases' },
      { k:'tournament_category',  l:'Cat',   sel:['8a','7a','6a','5a'] },
      { k:'status',               l:'Status', sel:['em_curso','finalizado','cancelado'] },
      { k:'created_at',           l:'Criado', ro:true },
    ],
  },

  matches_tournaments: {
    label:'Partidas Torneios', sheet:'Matches_Tournaments', get:'get_matches_tournaments', key:'match_id', readonly:false,
    cols:[
      { k:'match_id',           l:'ID',       ro:true },
      { k:'tournament_id',      l:'Torneio',  ro:true },
      { k:'phase',              l:'Fase' },
      { k:'group',              l:'Grupo' },
      { k:'team_a',             l:'Equipa A' },
      { k:'team_b',             l:'Equipa B' },
      { k:'score_a',            l:'A' },
      { k:'score_b',            l:'B' },
      { k:'winner_team',        l:'Vencedor', ro:true },
      { k:'match_serial_number',l:'Nº' },
      { k:'tie_break',          l:'TB',    sel:['Não','Sim'] },
      { k:'tb_a',               l:'TB A' },
      { k:'tb_b',               l:'TB B' },
      { k:'saved_at',           l:'Saved',  ro:true },
    ],
  },

  scorecard_tournaments: {
    label:'Scorecard', sheet:'Scorecard_Tournaments', get:'get_scorecard_tournaments', key:'scorecard_id', readonly:false,
    cols:[
      { k:'scorecard_id',    l:'ID',       ro:true },
      { k:'tournament_id',   l:'Torneio',  ro:true },
      { k:'player',          l:'Jogador' },
      { k:'rank',            l:'Pos.' },
      { k:'tournament_name', l:'Nome Torneio' },
      { k:'date',            l:'Data' },
      { k:'pts_base',        l:'Base' },
      { k:'pts_bonus',       l:'Bónus' },
      { k:'pts_total',       l:'Total' },
      { k:'phase_achieved',  l:'Fase' },
      { k:'created_at',      l:'Criado', ro:true },
    ],
  },

  ranking_tournaments: {
    label:'Ranking Torneios', sheet:'Ranking_Tournaments', get:'get_ranking_tournaments', key:'player', readonly:false,
    cols:[
      { k:'player',                 l:'Jogador' },
      { k:'pts_total',              l:'Pts' },
      { k:'tournament_qty',         l:'T' },
      { k:'tournament_titles',      l:'🥇' },
      { k:'tournament_runner_up',   l:'🥈' },
      { k:'best_phase_achieved',    l:'Melhor Fase' },
      { k:'matches',                l:'P' },
      { k:'wins',                   l:'V' },
      { k:'losses',                 l:'D' },
      { k:'points_for',             l:'PF' },
      { k:'points_against',         l:'PA' },
      { k:'points_difference',      l:'GD' },
      { k:'win_rate',               l:'Win%' },
      { k:'last_tournament_date',   l:'Último' },
      { k:'updated_at',             l:'Updated', ro:true },
    ],
  },

  sessions: {
    label:'Sessões', sheet:'Sessions_Sessions', get:'get_sessions', key:'session_id', readonly:false,
    cols:[
      { k:'session_id',             l:'ID',        ro:true },
      { k:'session_serial_number',  l:'Nº' },
      { k:'session_date',           l:'Data' },
      { k:'session_venue',          l:'Local' },
      { k:'session_total_players',  l:'Jogadores' },
      { k:'session_total_matches',  l:'Partidas' },
      { k:'session_mvp',            l:'MVP' },
      { k:'session_source',         l:'Fonte' },
      { k:'session_format',         l:'Formato' },
      { k:'notes',                  l:'Notas' },
      { k:'created_at',             l:'Criado', ro:true },
    ],
  },

  matches_sessions: {
    label:'Partidas Sessões', sheet:'Matches_Sessions', get:'get_session_matches', key:'match_id', readonly:true,
    cols:[
      { k:'match_id',            l:'ID',       ro:true },
      { k:'session_id',          l:'Sessão',   ro:true },
      { k:'session',             l:'Nº Sess' },
      { k:'date',                l:'Data' },
      { k:'match_serial_number', l:'Nº' },
      { k:'team_a',              l:'Equipa A' },
      { k:'score_a',             l:'A' },
      { k:'score_b',             l:'B' },
      { k:'team_b',              l:'Equipa B' },
      { k:'winner_team',         l:'Vencedor', ro:true },
      { k:'tie_break',           l:'TB' },
      { k:'tb_a',                l:'TB A' },
      { k:'tb_b',                l:'TB B' },
      { k:'status',              l:'Status' },
      { k:'created_at',          l:'Criado', ro:true },
    ],
  },

  stats_sessions: {
    label:'Stats Sessões', sheet:'Stats_Sessions', get:'get_session_stats', key:'stat_id', readonly:true,
    cols:[
      { k:'stat_id',              l:'ID',      ro:true },
      { k:'session_id',           l:'Sessão',  ro:true },
      { k:'session_serial_number',l:'Nº' },
      { k:'date',                 l:'Data' },

// ── STATE ────────────────────────────────────────────────────────
let data        = {};
let active      = 'trn_browser';
let editRow     = null;
let query       = '';
let _trnMatches = [];
let _trnScores  = [];

// ── NETWORK ──────────────────────────────────────────────────────
async function post(action, payload) {
  const res = await fetch(URL_BASE, {
    method: 'POST', headers: {'Content-Type':'text/plain'},
    body: JSON.stringify({ action, data: payload, timestamp: new Date().toISOString() })
  });
  return res.json();
}

async function get(action, params) {
  let url = `${URL_BASE}?action=${action}`;
  if (params) Object.keys(params).forEach(k => url += `&${k}=${encodeURIComponent(params[k])}`);
  const res = await fetch(url);
  return res.json();
}

async function ping() {
  try {
    const res = await fetch(`${URL_BASE}?action=ping`);
    const j = await res.json();
    setConn(j.ok ? 'ok' : 'err', j.ok ? `V7 · ${j.env||'prod'}` : 'Erro');
    return j.ok;
  } catch(e) {
    setConn('err', 'Sem ligação'); return false;
  }
}

// ── LOAD ALL ──────────────────────────────────────────────────────
async function loadAll() {
  render('<div class="ctr"><div class="spin"></div> A carregar tabelas...</div>');
  setConn('','A ligar...');
  const ok = await ping();
  if (!ok) { render('<div class="ctr">❌ Sem ligação. Verifique a URL.</div>'); return; }

  const keys = Object.keys(TABLES).filter(k => !['health','trn_browser'].includes(k));
  let loaded = 0;
  for (const k of keys) {
    try {
      const j = await get(TABLES[k].get);
      data[k] = j.rows || [];
      loaded++;
      const nb = document.getElementById('nb-trn');
      if (k === 'tournaments' && nb) nb.textContent = data[k].length;
    } catch(e) {
      data[k] = [];
    }
  }
  toast(`✅ ${loaded}/${keys.length} tabelas carregadas`, loaded===keys.length?'ok':'wa');
  drawActive();
}

// ── NAV ──────────────────────────────────────────────────────────
function go(k, btn) {
  active = k; editRow = null; query = '';
  document.querySelectorAll('.sb-item').forEach(el => el.classList.remove('on'));
  (btn || document.getElementById('nav-'+k))?.classList.add('on');
  drawActive();
}

function drawActive() {
  if (active === 'health')       return drawHealth();
  if (active === 'trn_browser')  return drawTrnBrowser();
  drawTab(active);
}

// ── TABLE VIEW ────────────────────────────────────────────────────
function drawTab(k) {
  const def  = TABLES[k];
  const rows = data[k] || [];
  const filt = query
    ? rows.filter(r => Object.values(r).some(v => String(v).toLowerCase().includes(query.toLowerCase())))
    : rows;

  let html = `<div class="search-bar">
    <input class="search-inp" placeholder="🔍 Pesquisar ${def.label}..." value="${query}"
      oninput="query=this.value;drawTab('${k}')" >
    <button class="btn-sm btn-gold" onclick="loadAll()">⟳</button>
  </div>
  <div class="card">
    <div class="card-hd">
      <span class="card-title">${def.sheet}</span>
      <span class="badge gray" style="margin-left:auto">${filt.length} / ${rows.length} registos</span>
    </div>
    <div class="tbl-wrap"><table><thead><tr>`;

  def.cols.forEach(c => { html += `<th>${c.l}</th>`; });
  if (!def.readonly) html += '<th></th>';
  html += '</tr></thead><tbody>';

  filt.forEach((r, ri) => {
    const isEdit = editRow === ri;
    html += '<tr>';
    def.cols.forEach(c => {
      const v = r[c.k] ?? '';
      if (isEdit && !c.ro) {
        if (c.sel) {
          html += `<td><select id="ed_${c.k}">${c.sel.map(s=>`<option ${s==v?'selected':''}>${s}</option>`).join('')}</select></td>`;
        } else {
          html += `<td><input id="ed_${c.k}" value="${String(v).replace(/"/g,'&quot;')}"></td>`;
        }
      } else {
        const cls = c.k.endsWith('_id')||c.k==='player' ? 'key' : '';
        html += `<td class="${cls}">${fmt(v, c.k)}</td>`;
      }
    });
    if (!def.readonly) {
      if (isEdit) {
        html += `<td><button class="btn-sm btn-save" onclick="save('${k}',${ri})">💾</button>
                     <button class="btn-sm btn-cancel" onclick="editRow=null;drawTab('${k}')">✕</button></td>`;
      } else {
        html += `<td><button class="btn-sm btn-edit" onclick="startEdit('${k}',${ri})">✏</button></td>`;
      }
    }
    html += '</tr>';
  });

  html += '</tbody></table></div></div>';
  render(html);
}

function fmt(v, k) {
  if (v === '' || v === null || v === undefined) return '<span style="color:#c0cdd8">—</span>';
  const s = String(v);
  if (k === 'status') {
    const map = {finalizado:'green',em_curso:'gold',cancelado:'red'};
    return `<span class="badge ${map[s]||'gray'}">${s}</span>`;
  }
  if (k === 'rank' || k === 'posicao') return `<span style="font-size:16px">${s}</span>`;
  if (k === 'active' || k === 'player_mvp') {
    return s==='TRUE'||s==='true'||s==='Yes'
      ? '<span class="badge green">✓</span>'
      : '<span class="badge gray">—</span>';
  }
  if (k === 'tie_break') return s==='Sim'||s==='Yes' ? '<span class="badge gold">TB</span>' : '—';
  if (k.endsWith('_at') || k==='saved_at' || k==='date') return `<span style="font-family:DM Mono,monospace;font-size:10px;color:#7090b0">${s.slice(0,16).replace('T',' ')}</span>`;
  if (k.endsWith('_id')) return `<span style="font-family:DM Mono,monospace;font-size:9px;color:#b0c4d8">${s.slice(0,18)}…</span>`;
  return s;
}

function startEdit(k, ri) { editRow = ri; drawTab(k); }

async function save(k, ri) {
  const def  = TABLES[k];
  const orig = (data[k]||[])[ri];
  if (!orig) return;
  const upd = { ...orig };
  def.cols.filter(c=>!c.ro).forEach(c => {
    const el = document.getElementById('ed_'+c.k);
    if (el) upd[c.k] = el.value;
  });
  try {
    const res = await post('update_row', {
      sheet: def.sheet, keyCol: def.key,
      keyVal: orig[def.key], updates: upd
    });
    if (res.ok || res.updated) {
      data[k][ri] = upd;
      toast('✅ Guardado', 'ok');
    } else {
      toast('⚠️ ' + (res.error||'Erro'), 'wa');
    }
  } catch(e) { toast('❌ ' + e.message, 'er'); }
  editRow = null;
  drawTab(k);
}

async function reload(k) {
  try {
    const j = await get(TABLES[k].get);
    data[k] = j.rows || [];
    drawTab(k);
    toast('✅ Recarregado', 'ok');
  } catch(e) { toast('❌ ' + e.message, 'er'); }
}

function drawHealth() {
  const checks = Object.keys(TABLES).filter(k=>!['health','trn_browser'].includes(k));
  let html = `<div class="card"><div class="card-hd"><span class="card-title">Health Check · GS V7</span>
    <button class="btn-sm btn-gold" style="margin-left:auto" onclick="runPing()">▶ Testar Ping</button>

    <div id="ping-result" style="margin-bottom:16px;font-family:DM Mono,monospace;font-size:11px;color:var(--muted)">Clique em "Testar Ping" para verificar a ligação.</div>

    const rows = (data[k]||[]).length;

    html += `<div class="health-card">
      <div class="hc-name">${TABLES[k].sheet}</div>

      <div class="hc-sub">${TABLES[k].get}</div>

async function runPing() {
  const el = document.getElementById('ping-result');
  if (el) el.innerHTML = '<span style="color:var(--muted)">A pingar...</span>';
  try {
    const res = await fetch(`${URL_BASE}?action=ping`);

    if (el) el.innerHTML = `<span style="color:var(--green)">✅ ${JSON.stringify(j)}</span>`;
    setConn('ok', `V7 · ${j.env||'prod'}`);
  } catch(e) {
    if (el) el.innerHTML = `<span style="color:var(--red)">❌ ${e.message}</span>`;
    setConn('err','Erro');
  }
}

// ── RODADAS TAB ────────────────────────────────────────────────────
function buildRodadas(tm) {
  const phases = [...new Set(tm.map(m=>m.phase).filter(Boolean))];
  if (!phases.length) return '<div class="ctr">Sem partidas registadas.</div>';
  const PHASE_ORDER = ['Fase 1','Fase 2','Fase 3','Semi-final','Final'];
  phases.sort((a,b)=>(PHASE_ORDER.indexOf(a)+99)-(PHASE_ORDER.indexOf(b)+99));

  return phases.map(phase => {
    const pm = tm.filter(m=>m.phase===phase);
    const groups = [...new Set(pm.map(m=>m.group).filter(Boolean))].sort();
    return `<div class="grp-section">
      <div class="grp-title">${phase} <span class="grp-badge">${pm.length} partidas</span></div>
      ${groups.map(g => {
        const gm = pm.filter(m=>m.group===g);
        return `<div style="margin-bottom:12px">
          <div style="font-family:DM Mono,monospace;font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;padding:0 2px">Grupo ${g}</div>
          ${gm.map(m=>matchRow(m)).join('')}
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
}

// ── GRUPOS TAB ─────────────────────────────────────────────────────
function buildGrupos(tm) {
  // Only use Fase 1 (group stage matches)
  const gm = tm.filter(m => m.phase && m.phase.toLowerCase().includes('fase'));
  if (!gm.length) return '<div class="ctr">Sem partidas de fase de grupos.</div>';
  const groups = [...new Set(gm.map(m=>m.group).filter(Boolean))].sort();

  return groups.map(g => {
    const matches = gm.filter(m=>m.group===g);
    const players = {};
    matches.forEach(m => {
      const ta = (m.team_a||'').split(' / ').filter(Boolean);
      const tb = (m.team_b||'').split(' / ').filter(Boolean);
      const sa = +(m.score_a||0), sb = +(m.score_b||0);
      const aWin = sa > sb;
      [...ta,...tb].forEach(p=>{if(!players[p])players[p]={p,m:0,w:0,l:0,pf:0,pa:0};});
      ta.forEach(p=>{players[p].m++;players[p].pf+=sa;players[p].pa+=sb;if(aWin)players[p].w++;else players[p].l++;});
      tb.forEach(p=>{players[p].m++;players[p].pf+=sb;players[p].pa+=sa;if(!aWin)players[p].w++;else players[p].l++;});
    });
    const sorted = Object.values(players).sort((a,b)=>b.w-a.w||(b.pf-b.pa)-(a.pf-a.pa));
    return `<div class="grp-section">
      <div class="grp-title">Grupo ${g} <span class="grp-badge">${matches.length} partidas</span></div>
      <div class="card"><div class="tbl-wrap"><table>
        <thead><tr>
          <th>#</th><th>Jogador</th><th>P</th><th>V</th><th>D</th><th>PF</th><th>PA</th><th>GD</th>
        </tr></thead>
        <tbody>${sorted.map((p,i)=>{
          const gd=p.pf-p.pa;
          return `<tr ${i===0?'style="background:#fffbf0"':''}>
            <td style="font-family:Bebas Neue;font-size:18px;color:var(--muted)">${i+1}</td>
            <td style="font-weight:700">${p.p}</td>
            <td class="mono">${p.m}</td>
            <td class="mono" style="color:var(--green);font-weight:700">${p.w}</td>
            <td class="mono" style="color:var(--muted)">${p.l}</td>
            <td class="mono">${p.pf}</td>
            <td class="mono">${p.pa}</td>
            <td class="mono" style="font-weight:700;color:${gd>=0?'var(--green)':'var(--red)'}">${gd>=0?'+':''}${gd}</td>
          </tr>`;
        }).join('')}</tbody>
      </table></div></div>
    </div>`;
  }).join('');
}

// ── ESTATÍSTICAS TAB ───────────────────────────────────────────────
function buildStats(tm) {
  if (!tm.length) return '<div class="ctr">Sem partidas.</div>';
  const players = {};
  tm.forEach(m => {
    const ta = (m.team_a||'').split(' / ').filter(Boolean);
    const tb = (m.team_b||'').split(' / ').filter(Boolean);
    const sa = +(m.score_a||0), sb = +(m.score_b||0);
    const aWin = sa > sb;
    [...ta,...tb].forEach(p=>{if(!players[p])players[p]={p,m:0,w:0,l:0,pf:0,pa:0};});
    ta.forEach(p=>{players[p].m++;players[p].pf+=sa;players[p].pa+=sb;if(aWin)players[p].w++;else players[p].l++;});
    tb.forEach(p=>{players[p].m++;players[p].pf+=sb;players[p].pa+=sa;if(!aWin)players[p].w++;else players[p].l++;});
  });
  const sorted = Object.values(players).sort((a,b)=>b.w-a.w||(b.pf-b.pa)-(a.pf-a.pa));
  return `<div class="card"><div class="tbl-wrap"><table class="stats-tbl">
    <thead><tr>
      <th>#</th><th>Jogador</th><th>Partidas</th><th>Vitórias</th><th>Derrotas</th>
      <th>Win%</th><th>PF</th><th>PA</th><th>GD</th>
    </tr></thead>
    <tbody>${sorted.map((p,i)=>{
      const gd=p.pf-p.pa;
      const wr=p.m>0?Math.round(p.w/p.m*100):0;
      return `<tr>
        <td style="font-family:Bebas Neue;font-size:18px;color:var(--muted)">${i+1}</td>
        <td style="font-weight:700">${p.p}</td>
        <td class="mono">${p.m}</td>
        <td class="mono" style="color:var(--green);font-weight:700">${p.w}</td>
        <td class="mono" style="color:var(--muted)">${p.l}</td>
        <td class="mono" style="font-weight:700;color:${wr>=60?'var(--green)':wr<30?'var(--red)':'var(--text)'}">${wr}%</td>
        <td class="mono">${p.pf}</td>
        <td class="mono">${p.pa}</td>
        <td class="mono" style="font-weight:700;color:${gd>=0?'var(--green)':'var(--red)'}">${gd>=0?'+':''}${gd}</td>
      </tr>`;
    }).join('')}</tbody>
  </table></div></div>`;
}

// ── HISTÓRICO TAB ──────────────────────────────────────────────────
function buildHistorico(tm) {
  if (!tm.length) return '<div class="ctr">Sem partidas.</div>';
  const PHASE_ORDER = ['Fase 1','Fase 2','Fase 3','Semi-final','Final'];
  const sorted = [...tm].sort((a,b)=>{
    const pi = (x) => PHASE_ORDER.indexOf(x.phase);
    if (pi(a) !== pi(b)) return pi(a) - pi(b);
    return (+(a.match_serial_number||0)) - (+(b.match_serial_number||0));
  });
  return sorted.map(m => matchRow(m, true)).join('');
}

// ── SCORECARD TAB ──────────────────────────────────────────────────
function buildScorecard(sc) {
  if (!sc.length) return '<div class="ctr">Sem scorecard.</div>';
  const sorted = [...sc].sort((a,b) => {
    const rankOrder = ['🥇','🥈','🥉','4º'];
    const ai = rankOrder.indexOf(a.rank), bi = rankOrder.indexOf(b.rank);
    if (ai>=0&&bi>=0) return ai-bi;
    if (ai>=0) return -1;
    if (bi>=0) return 1;
    return (+(b.pts_total||0)) - (+(a.pts_total||0));
  });
  const rankClass = r => r==='🥇'?'gold':r==='🥈'?'silver':'';
  const colors = ['#3a7bd5','#e74c3c','#2ecc71','#9b59b6','#e67e22','#1abc9c','#e91e63','#607d8b'];
  const pc = name => colors[Math.abs((name||'').split('').reduce((h,c)=>h*31+c.charCodeAt(0),0))%colors.length];
  const ini = name => { if(!name)return'?'; const p=name.trim().split(' '); return p.length>1?(p[0][0]+p[p.length-1][0]).toUpperCase():name.slice(0,2).toUpperCase(); };

  return sorted.map(s => `
    <div class="sc-row ${rankClass(s.rank)}">
      <div class="sc-rank">${s.rank||'—'}</div>
      <div class="sc-av" style="background:${pc(s.player)}">${ini(s.player)}</div>
      <div class="sc-info">
        <div class="sc-name">${s.player||'—'}</div>
        <div class="sc-phase">${s.phase_achieved||'—'} · Base: ${s.pts_base||0} + Bónus: ${s.pts_bonus||0}</div>
      </div>
      <div class="sc-pts">${s.pts_total||0}<span style="font-size:11px;color:var(--muted);font-family:'DM Sans'"> pts</span></div>
    </div>`).join('');
}

// ── MATCH ROW (shared) ─────────────────────────────────────────────
function matchRow(m, showPhase=false) {
  const sa = +(m.score_a||0), sb = +(m.score_b||0);
  const aWin = sa > sb;
  const hasTB = m.tie_break==='Sim'||m.tie_break==='Yes';
  const tbTag = hasTB ? `<div style="font-size:9px;color:var(--accent);font-family:DM Mono,monospace">TB ${m.tb_a||''}×${m.tb_b||''}</div>` : '';
  const meta = showPhase ? `${m.phase||''}${m.group?' · Grupo '+m.group:''}` : `Grupo ${m.group||'?'}`;
  return `<div class="hist-match">
    <div class="hist-team ${aWin?'win':'lose'}">${m.team_a||'—'}</div>
    <div>
      <div class="hist-score">
        <span style="color:${aWin?'var(--green)':'var(--muted)'}">${sa}</span>
        <span style="color:var(--border);font-size:14px"> × </span>
        <span style="color:${!aWin?'var(--green)':'var(--muted)'}">${sb}</span>
      </div>
      ${tbTag}
      <div class="hist-meta">${meta} · #${m.match_serial_number||'?'}</div>
    </div>
    <div class="hist-team right ${aWin?'lose':'win'}">${m.team_b||'—'}</div>
  </div>`;
}

// ── UTILS ─────────────────────────────────────────────────────────
function render(html) { document.getElementById('main').innerHTML = html; }

function setConn(state, lbl) {
  const dot = document.getElementById('conn-dot');
  const l   = document.getElementById('conn-lbl');
  if (dot) { dot.className = 't-dot ' + (state||''); }
  if (l)   l.textContent = lbl || '—';
}

function editURL() {
  const n = prompt('GS V7 URL:', URL_BASE);
  if (n && n.startsWith('https://')) {
    URL_BASE = n;
    localStorage.setItem('pe_dbm_url', n);
    document.getElementById('url-disp').textContent = n;
    toast('URL guardada. A recarregar...', 'ok');
    setTimeout(loadAll, 400);
  }
}

function toast(msg, type='in') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = type;
  el.style.display = 'block';
  setTimeout(() => el.style.display='none', 3500);
}

// ── INIT ──────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => loadAll());
</script>
